<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes | Alerta Roja</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <header class="encabezado">
    <div class="contenedor encabezado-contenido">
      <h1>Alerta Roja</h1>
      <nav>
        <ul class="menu">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="crear-reporte.html">Crear reporte</a></li>
          <li><a href="admin.html">Admin</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="contenedor">
    <section class="titulo-pagina">
      <h2>Reportes ciudadanos</h2>
      <p>Consulta incidencias registradas por ubicación, categoría y nivel de prioridad.</p>
    </section>

    <section class="filtros-reportes">
      <div class="grupo-formulario">
        <label for="filtroCategoria">Categoría</label>
        <select id="filtroCategoria">
          <option value="">Todas</option>
          <option value="Inundación">Inundación</option>
          <option value="Incendio">Incendio</option>
          <option value="Accidente">Accidente</option>
          <option value="Deslizamiento">Deslizamiento</option>
          <option value="Asalto">Asalto</option>
          <option value="Riesgo comunitario">Riesgo comunitario</option>
        </select>
      </div>

      <div class="grupo-formulario">
        <label for="filtroProvincia">Provincia</label>
        <select id="filtroProvincia">
          <option value="">Todas</option>
          <option value="San José">San José</option>
          <option value="Alajuela">Alajuela</option>
          <option value="Cartago">Cartago</option>
          <option value="Heredia">Heredia</option>
          <option value="Guanacaste">Guanacaste</option>
          <option value="Puntarenas">Puntarenas</option>
          <option value="Limón">Limón</option>
        </select>
      </div>

      <div class="grupo-formulario">
        <label for="filtroEstado">Estado</label>
        <select id="filtroEstado">
          <option value="">Todos</option>
          <option value="Registrado">Registrado</option>
          <option value="En revisión">En revisión</option>
          <option value="Prioritario">Prioritario</option>
          <option value="Enviado">Enviado</option>
          <option value="Atendido">Atendido</option>
          <option value="Cerrado">Cerrado</option>
        </select>
      </div>

      <div class="grupo-formulario filtro-boton">
        <label>&nbsp;</label>
        <button id="btnFiltrarReportes" class="btn btn-principal" type="button">Filtrar</button>
      </div>
    </section>

    <section id="contenedorReportes" class="contenedor-reportes">
      <p>Cargando reportes...</p>
    </section>
  </main>

  <script src="../Js/app.js"></script>
</body>
</html>
